name: Deployment

on:
  push:
    tags:
      # ここは glob。タグの書式は parse_version で検証する。
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'ビルドする既存のタグ（例: v1.2.3-rc.1）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  parse_version:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      full_version: ${{ steps.parse.outputs.full_version }}
      version: ${{ steps.parse.outputs.version }}
      commit: ${{ steps.parse.outputs.commit }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Validate tag and resolve commit
        id: parse
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            TAG=$DISPATCH_TAG
          else
            [[ "$GITHUB_REF" == refs/tags/* ]] || { echo 'A release requires a tag.' >&2; exit 1; }
            TAG=${GITHUB_REF#refs/tags/}
          fi
          VERSION_PATTERN='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$TAG" =~ $VERSION_PATTERN ]] || { echo 'Invalid release tag.' >&2; exit 1; }
          VERSION=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}
          PRERELEASE=false
          if [[ -n "${BASH_REMATCH[4]}" ]]; then PRERELEASE=true; fi
          COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Could not resolve tag commit.' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$COMMIT" != "$GITHUB_SHA" ]]; then
            echo 'Release tag no longer points to the pushed commit.' >&2
            exit 1
          fi
          printf '%s\n' "tag=$TAG" "full_version=${TAG#v}" "version=$VERSION" \
            "commit=$COMMIT" "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  make:
    needs: parse_version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
            extension: exe
            arch_suffix: ''
          - os: macos-15-intel
            target: macos-x86_64
            extension: dmg
            arch_suffix: -x86_64
          - os: macos-15
            target: macos-arm64
            extension: dmg
            arch_suffix: -arm64
    env:
      APP_VERSION: ${{ needs.parse_version.outputs.full_version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.parse_version.outputs.commit }}
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          check-latest: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat "-Papp.version=$env:APP_VERSION" make
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: ./gradlew "-Papp.version=$APP_VERSION" make
      - name: Prepare installer for upload
        id: installer
        shell: bash
        env:
          NATIVE_VERSION: ${{ needs.parse_version.outputs.version }}
          EXTENSION: ${{ matrix.extension }}
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
        run: |
          source="build/app/Twitch Chat Viewer-$NATIVE_VERSION.$EXTENSION"
          target="build/distribution/Twitch Chat Viewer-$APP_VERSION$ARCH_SUFFIX.$EXTENSION"
          if [[ ! -f "$source" || ! -s "$source" ]]; then
            echo "Missing or empty installer: $source" >&2
            exit 1
          fi
          mkdir -p build/distribution
          cp -- "$source" "$target"
          printf 'path=%s\n' "$target" >> "$GITHUB_OUTPUT"
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.target }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
      - name: Upload packaging log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-log-${{ matrix.target }}
          path: build/reports/packaging/make.log
          if-no-files-found: ignore
          overwrite: true

  release:
    needs: [make, parse_version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: deployment-${{ needs.parse_version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: build/distribution/
      - name: Verify release target
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.parse_version.outputs.tag }}
          COMMIT: ${{ needs.parse_version.outputs.commit }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          if [[ "$current" != "$COMMIT" ]]; then
            echo "Tag $TAG changed during the build." >&2
            exit 1
          fi
          published_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft | not) | .tag_name')
          if grep -Fxq -- "$TAG" <<< "$published_tags"; then
            echo "Release $TAG is already published; its assets will not be modified." >&2
            exit 1
          fi
      - name: Create or update draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.parse_version.outputs.tag }}
          draft: true # 公開は手動で行う。
          prerelease: ${{ needs.parse_version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            build/distribution/*-x86_64.dmg
            build/distribution/*-arm64.dmg
            build/distribution/*.exe
