import com.github.k7t3.tcv.build.JdkModulesTask
import com.github.k7t3.tcv.build.JdkToolTask
import com.github.k7t3.tcv.build.NativePackageTask
import com.github.k7t3.tcv.build.PackagePlan
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.process.CommandLineArgumentProvider

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'project-report'
}

group = 'io.github.k7t3'
version = project.findProperty("app.version") ?: '1.0.0-dev'
PackagePlan.nativeVersion(version.toString())

repositories {
    mavenCentral()
}

def javaFeature = libs.versions.java.get().toInteger()
java { toolchain { languageVersion = JavaLanguageVersion.of(javaFeature) } }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaFeature
}

javafx {
    version = libs.versions.javafx.get()
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.swing' ]
}

application {
    mainClass = 'com.github.k7t3.tcv.view.Launcher'
    applicationName = 'Twitch Chat Viewer'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

configurations {
    mockitoAgent { canBeConsumed = false; transitive = false }
    runtimeClasspath {
        // 旧Helix builderの設定依存は、上流SDKとの比較テスト側だけで使用する。
        exclude group: 'commons-configuration', module: 'commons-configuration'
        exclude group: 'commons-lang', module: 'commons-lang'
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

dependencies {

    // Logger
    implementation libs.slf4j.api
    implementation libs.slf4j.jdk14

    // Twitchクライアント
    implementation libs.twitch.auth
    implementation libs.twitch.chat
    implementation libs.twitch.common
    implementation(libs.twitch.helix) {
        exclude group: 'io.github.openfeign', module: 'feign-hystrix'
    }
    implementation libs.feign.core
    implementation libs.feign.jackson
    implementation libs.feign.okhttp
    implementation libs.bucket4j

    // キャッシュ
    implementation libs.caffeine

    // 永続化
    implementation libs.sqlite

    // Twitch認証用のQRコード生成
    implementation libs.zxing

    // AtlantaFXと同じアイコンパックを使用する
    implementation libs.atlantafx
    implementation libs.ikonli.javafx
    implementation libs.ikonli.feather
    implementation libs.ikonli.material2

    // アイコンパック
    implementation libs.ikonli.fontawesome5

    // MVVM
    implementation libs.mvvmfx

    // チャットビュー用のVirtualFlow
    implementation libs.flowless

    // テスト
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher

    testImplementation libs.testfx.junit5

    testImplementation libs.assertj
    testImplementation libs.hamcrest


    testImplementation libs.mockito
    // 上流SDKとのHTTP契約比較だけは、従来のコマンド実行をテスト側で維持する。
    testImplementation libs.twitch.helix
    mockitoAgent libs.mockito
}

// 配布入力を専用ディレクトリに同期する。古いアプリ JAR や依存 JAR を混入させない。
def javafxArtifacts = configurations.runtimeClasspath.incoming.artifactView {
    componentFilter { id -> id instanceof ModuleComponentIdentifier && id.group == 'org.openjfx' }
}.files
def applicationArtifacts = configurations.runtimeClasspath.incoming.artifactView {
    componentFilter { id -> !(id instanceof ModuleComponentIdentifier && id.group == 'org.openjfx') }
}.files

def packageInput = tasks.register('copyDependencies', Sync) {
    from applicationArtifacts
    from tasks.named('jar', Jar).flatMap { it.archiveFile }
    from('LICENSE.md')
    from('src/main/packaging')
    from('docs') { include 'license.md', 'external-libraries.md', 'licenses/**'; into 'docs' }
    into layout.buildDirectory.dir('packaging/input')
}

def javafxInput = tasks.register('copyJavaFXModules', Sync) {
    from javafxArtifacts
    into layout.buildDirectory.dir('packaging/javafx')
}

def packageJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(javaFeature) }
tasks.withType(JdkToolTask).configureEach { javaFeatureVersion = javaFeature }
def moduleCheck = tasks.register('checkJDKModules', JdkModulesTask) {
    dependsOn packageInput, javafxInput
    javaLauncher = packageJava
    inputDirectory = layout.buildDirectory.dir('packaging/input')
    moduleDirectory = layout.buildDirectory.dir('packaging/javafx')
    mainJar = tasks.named('jar', Jar).flatMap { it.archiveFileName }
    javafxModules = javafx.modules
    modulesFile = layout.buildDirectory.file('packaging/jdk-modules.txt')
}

def packagePlatform = PackagePlan.Platform.fromOsName(System.getProperty('os.name'))
tasks.withType(NativePackageTask).configureEach {
    group = 'distribution'
    dependsOn moduleCheck
    javaLauncher = packageJava
    inputDirectory = layout.buildDirectory.dir('packaging/input')
    moduleDirectory = layout.buildDirectory.dir('packaging/javafx')
    modulesFile = moduleCheck.flatMap { it.modulesFile }
    mainJar = tasks.named('jar', Jar).flatMap { it.archiveFileName }
    mainClass = application.mainClass
    fullVersion = project.version.toString()
    platformName = packagePlatform.name()
    projectRoot = layout.projectDirectory
    packageResources.from(layout.projectDirectory.file('docs/license.md'),
            layout.projectDirectory.file("src/main/resources/icons/${packagePlatform.iconName()}"))
    logFile = layout.buildDirectory.file("reports/packaging/${name}.log")
}

tasks.register('make', NativePackageTask) {
    description = '現在の OS 向けインストーラーを生成する'
    appImage = false
    outputDirectory = layout.buildDirectory.dir('app')
}

tasks.register('appImage', NativePackageTask) {
    description = 'インストール不要のアプリケーションイメージを生成する'
    appImage = true
    outputDirectory = layout.buildDirectory.dir('app-image')
}

abstract class MockitoAgentProvider implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getAgentJar()

    @Override Iterable<String> asArguments() { ["-javaagent:${agentJar.singleFile.absolutePath}"] }
}

abstract class ProductionClasspathProvider implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getRuntimeClasspath()

    @Override Iterable<String> asArguments() { ["-Dtcv.test.production.classpath=${runtimeClasspath.asPath}"] }
}

test {
    def headlessMode = !project.hasProperty('headless') || project.headless == 'true'
    // GUI の toolkit とウィンドウの状態をテストクラス間で共有しない。
    forkEvery = headlessMode ? 0 : 1
    systemProperty('tcv.test.headless', headlessMode.toString())
    systemProperty('testfx.robot', 'glass')
    // TestFX's legacy bootstrap selects Monocle; the toolkit now owns headless mode.
    systemProperty('testfx.headless', 'false')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    jvmArgumentProviders.add(objects.newInstance(MockitoAgentProvider).tap {
        agentJar.from(configurations.mockitoAgent)
    })
    jvmArgumentProviders.add(objects.newInstance(ProductionClasspathProvider).tap {
        runtimeClasspath.from(sourceSets.main.runtimeClasspath)
    })
    if (headlessMode) {
        systemProperty('glass.platform', 'headless')
        systemProperty('java.awt.headless', 'true')
        systemProperty("prism.order", "sw")
    }

    useJUnitPlatform {
        if (!providers.gradleProperty('osKeychainTests').map { it.toBoolean() }.getOrElse(false)) {
            excludeTags 'os-keychain'
        }
    }
}
